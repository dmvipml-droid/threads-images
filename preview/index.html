<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安藤 投稿プレビュー</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:#f5f5f7; margin:0; color:#111; }
  header { position: sticky; top:0; background:#fff; border-bottom:1px solid #ddd; padding:12px 16px; z-index:10; }
  header h1 { font-size:17px; margin:0 0 4px; }
  header .meta { font-size:12px; color:#666; }
  nav { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  nav button { border:1px solid #ccc; background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  nav button.active { background:#111; color:#fff; border-color:#111; }
  main { max-width:680px; margin:0 auto; padding:16px 12px 48px; }
  .card { background:#fff; border:1px solid #e2e2e6; border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#eef; color:#225; }
  .badge.src { background:#f0f0f0; color:#555; }
  .body-box { border:2px solid #2f6fed; border-radius:10px; padding:10px 12px; white-space:pre-wrap; line-height:1.7; font-size:15px; }
  .reply { border-left:3px solid #ccc; margin-top:10px; padding:6px 10px; white-space:pre-wrap; line-height:1.7; font-size:14px; color:#222; }
  .reply .rlabel { font-size:11px; color:#888; display:block; margin-bottom:2px; }
  img.post { max-width:100%; border-radius:10px; margin-top:10px; display:block; }
  .note-box { background:#fff8e6; border:1px solid #f0d48a; border-radius:10px; padding:10px 12px; margin-top:10px; white-space:pre-wrap; line-height:1.7; font-size:13.5px; }
  .note-box .nlabel { font-size:11px; color:#a07d10; display:block; margin-bottom:2px; font-weight:bold; }
  .empty { color:#888; text-align:center; padding:32px 0; }
</style>
</head>
<body>
<header>
  <h1>安藤 投稿プレビュー</h1>
  <div class="meta" id="meta">読み込み中…</div>
  <nav id="tabs"></nav>
</header>
<main id="list"></main>
<script>
const GROUPS = [
  ["all", "すべて"],
  ["pending", "承認待ち"],
  ["approved", "承認済み"],
  ["draft", "下書き"],
  ["held", "保留・ボツ"],
  ["posted", "投稿済み"],
];
let DATA = null, current = "pending";
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function render(){
  const list = document.getElementById("list");
  const items = DATA.items.filter(i => current==="all" || i.group===current);
  if(!items.length){ list.innerHTML = '<div class="empty">この区分にはまだ何もありません</div>'; return; }
  list.innerHTML = items.map(i => {
    const replies = (i.reply_texts||[]).map((r,idx) => {
      const rimg = (i.reply_image_urls||[])[idx];
      return '<div class="reply"><span class="rlabel">返信'+(idx+1)+'</span>'+esc(r)+(rimg ? '<img class="post" src="'+rimg+'">' : '')+'</div>';
    }).join("");
    return '<div class="card">'
      + '<div class="badges"><span class="badge">'+esc(i.status||i.group)+'</span>'
      + (i.topic_tag ? '<span class="badge">'+esc(i.topic_tag)+'</span>' : '')
      + '<span class="badge src">'+esc(i.id)+'</span></div>'
      + '<div class="body-box">'+esc(i.text)+'</div>'
      + (i.image_url ? '<img class="post" src="'+i.image_url+'">' : '')
      + replies
      + (i.hook_rationale ? '<div class="note-box"><span class="nlabel">フックが成り立つ理由</span>'+esc(i.hook_rationale)+'</div>' : '')
      + (i.expected_reaction ? '<div class="note-box"><span class="nlabel">想定する視聴者の反応</span>'+esc(i.expected_reaction)+'</div>' : '')
      + '</div>';
  }).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.g===current));
}
fetch("preview-data.json").then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById("meta").textContent = "最終更新: " + d.generated_at + " ／ 青枠が本文、その下が返信の順番です";
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = GROUPS.map(([g,label]) => {
    const n = g==="all" ? d.items.length : (d.counts[g]||0);
    return '<button data-g="'+g+'">'+label+' ('+n+')</button>';
  }).join("");
  tabs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { current = b.dataset.g; render(); }));
  render();
}).catch(e => { document.getElementById("meta").textContent = "データを読み込めませんでした"; });
</script>
</body>
</html>
